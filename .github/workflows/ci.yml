
name: E-Commerce CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and Test FastAPI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ecommerce_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d ecommerce_test_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://testuser:testpassword@localhost:5432/ecommerce_test_db
      TEST_DATABASE_URL: postgresql+psycopg2://testuser:testpassword@localhost:5432/ecommerce_test_db
      JWT_SECRET_KEY: ci_test_secret_key_not_for_production_1234567890
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      REDIS_CACHE_URL: redis://localhost:6379/0
      REDIS_RATE_LIMIT_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/2
      LOG_LEVEL: INFO
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx ruff

      - name: Create isolated test environment
        run: |
          printf 'TEST_DATABASE_URL=%s\n' "$TEST_DATABASE_URL" > .env.test

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run Ruff lint checks
        run: ruff check . --select E9,F63,F7,F82

      - name: Run pytest
        run: python -m pytest -v
